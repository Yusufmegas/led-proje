name: Deploy LEDProje to GitHub Pages

on:
  push:
    branches:
      - deploy/github-pages
      - checkpoint/visual-v5-projects-before-polish
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Repo adı led-proje olduğu için Pages siteyi /led-proje/ alt yolundan servis eder;
      # basePath ve assetPrefix bu yüzden zorunludur.
      GITHUB_PAGES_PROJECT: "true"
      NEXT_PUBLIC_SITE_URL: https://yusufmegas.github.io/led-proje
      # Önizleme dağıtımı: canonical domain ledproje.com.tr yayına alındığında
      # duplicate content oluşmaması için tüm sayfalar noindex + robots disallow.
      NEXT_PUBLIC_NOINDEX: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build static export
        run: npm run build
      - name: Add static RSC aliases
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve('out');
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              if (entry.isFile() && entry.name === '__PAGE__.txt' && path.basename(dir).startsWith('__next.')) {
                const target = path.join(path.dirname(dir), `${path.basename(dir)}.${entry.name}`);
                if (!fs.existsSync(target)) fs.copyFileSync(full, target);
              }
            }
          }
          walk(root);
          NODE
      - name: Add .nojekyll
        run: touch out/.nojekyll
      - name: Configure Pages
        if: ${{ vars.PAGES_ENABLED == 'true' }}
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: ${{ vars.PAGES_ENABLED == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
